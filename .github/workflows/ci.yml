name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        shopware: ['6.7.9.0', '6.7.*']
    name: PHP ${{ matrix.php }} / Shopware ${{ matrix.shopware }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer require --no-interaction --no-progress --no-scripts --ignore-platform-req=ext-* "shopware/core:${{ matrix.shopware }}"
      - name: PHPUnit
        run: composer test
      - name: PHPStan
        run: composer phpstan
